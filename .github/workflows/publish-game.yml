name: Publish game

# Publishes the spa site (unchanged) with the game alongside it at /game/ on GitHub Pages,
# so the game has a public link anyone can open.
on:
  push:
    branches: [claude/exciting-galileo-xpka2j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the spa site
        run: |
          npm ci
          npm run media:fetch
          npm run build
      - name: Build the game into /game
        working-directory: game
        run: |
          npm ci
          npm run build
          cp -r dist ../dist/game
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}game/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
