name: Publish sites (spa + MGTD)

# One GitHub Pages site per repository, so this publishes both projects together:
#   /       L'abri Day Spa (repository root)
#   /mgtd/  MGTD Environmental (mgtd/)
on:
  push:
    branches: [claude/nice-babbage-91xppv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mgtd/package-lock.json

      - name: Build the spa site
        run: |
          npm ci
          npm run media:fetch
          npm run build

      - name: Build the MGTD site (self-hosted media)
        working-directory: mgtd
        run: |
          npm ci
          npm run media:fetch
          npm run build

      - name: Combine
        run: |
          mkdir -p site
          cp -r dist/. site/
          mkdir -p site/mgtd
          cp -r mgtd/dist/. site/mgtd/

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}mgtd/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
